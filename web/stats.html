<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Stats · testson</title>
        <script src="/theme.js"></script>
        <link rel="stylesheet" href="/common.css" />
        <link rel="stylesheet" href="/stats.css" />
    </head>
    <body>
        <header class="topbar">
            <a class="brand" href="/">testson</a>
            <nav class="nav" aria-label="Pages">
                <a href="/">Games</a>
                <a href="/stats" aria-current="page">Stats</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" type="button">
                <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </header>
        <main>
            <header class="heading">
                <h1>Stats</h1>
            </header>
            <p id="error" role="alert" hidden></p>
            <section id="overall" class="overall"></section>
            <section id="board" class="card board" hidden>
                <h2>Latest tests</h2>
                <ul id="legend" class="legend"></ul>
                <ol id="games" class="game-rows"></ol>
                <div class="row-axis muted" aria-hidden="true">
                    <span>Older</span>
                    <span>Latest</span>
                </div>
            </section>
        </main>
        <script src="/common.js"></script>
        <script src="/stats.js"></script>
    </body>
</html>
