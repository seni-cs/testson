<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>testson</title>
        <script src="/theme.js"></script>
        <link rel="stylesheet" href="/common.css" />
        <link rel="stylesheet" href="/game.css" />
    </head>
    <body>
        <header class="topbar">
            <a class="brand" href="/">testson</a>
            <nav class="nav" aria-label="Pages">
                <a href="/" aria-current="page">Games</a>
                <a href="/stats">Stats</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" type="button">
                <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </header>
        <main>
            <a class="back" href="/">&larr; All games</a>
            <p id="error" role="alert" hidden></p>
            <header id="game" class="banner"></header>
            <div class="layout">
                <aside id="sidebar" class="card sidebar" hidden>
                    <h2>Test history <span id="count" class="count"></span></h2>
                    <nav id="tests" aria-label="Tests of this game"></nav>
                </aside>
                <article id="test" class="card detail" hidden></article>
            </div>
            <section id="history" class="card history" hidden>
                <h2>History</h2>
                <ol id="events"></ol>
            </section>
        </main>
        <dialog id="viewer" class="viewer">
            <form method="dialog">
                <button class="close" aria-label="Close">&times;</button>
            </form>
            <figure id="media"></figure>
        </dialog>
        <script src="/common.js"></script>
        <script src="/game.js"></script>
    </body>
</html>
